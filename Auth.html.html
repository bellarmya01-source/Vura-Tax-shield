<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Authentication</title>
    <link rel="stylesheet" href="stylepg.css" />
    <style>
      /* Quick inline CSS helper to hide the inactive form dynamically */
      .hidden {
        display: none !important;
      }
      .toggle-link {
        display: block;
        margin-top: -10px;
        margin-bottom: 22px;
        color: #0083d6;
        text-decoration: none;
        font-size: 0.9rem;
        cursor: pointer;
      }
      .toggle-link:hover {
        text-decoration: underline;
      }
    </style>
  </head>
  <body>
    <form id="signup-form" class="Bode">
      <h1>Sign Up</h1>
      <div class="input-group">
        <label for="signup-username">Full Name</label>
        <input
          type="text"
          id="signup-username"
          placeholder="Enter your full name"
          required
        />
      </div>

      <div class="input-group">
        <label for="signup-email">Email Address</label>
        <input
          type="email"
          id="signup-email"
          placeholder="you@example.com"
          required
        />
      </div>

      <div class="input-group">
        <label for="signup-password">Password</label>
        <input
          type="password"
          id="signup-password"
          placeholder="••••••••"
          minlength="6"
          required
        />
      </div>

      <a id="to-login" class="toggle-link"
        >Already have an account? Sign In here</a
      >

      <button type="submit" id="signup-btn" class="btn">Submit Sign Up</button>
    </form>

    <form id="signin-form" class="Bode hidden">
      <h1>Sign In</h1>

      <div class="input-group">
        <label for="signin-email">Email Address</label>
        <input
          type="email"
          id="signin-email"
          placeholder="you@example.com"
          required
        />
      </div>

      <div class="input-group">
        <label for="signin-password">Password</label>
        <input
          type="password"
          id="signin-password"
          placeholder="••••••••"
          minlength="6"
          required
        />
      </div>

      <a id="to-signup" class="toggle-link"
        >Don't have an account? Sign Up here</a
      >

      <button type="submit" id="signin-btn" class="btn">Submit Sign In</button>
    </form>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="Auth.js"></script>
  </body>
</html>
